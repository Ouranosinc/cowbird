name: Docker Hub Publishing

on:
  push:
    branches:
      - master
    paths:
      - "docker/Dockerfile-base"
      - "docker/Dockerfile-webservice"
      - "docker/Dockerfile-worker"
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: Cowbird tag to build and publish Docker images
        required: true
        type: string

concurrency:
  # For a given workflow, cancel previous builds on the default branch.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name == github.event.repository.default_branch }}

permissions:
  contents: read

jobs:
  build-publish-base:
    name: Build and publish (Cowbird base)
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: "pavics/cowbird"
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          disable-sudo: true
          egress-policy: audit

      - name: Validate requested tag
        if: github.event_name == 'workflow_dispatch'
        env:
          DOCKER_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$DOCKER_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::Tag must be a Docker-compatible slug of at most 128 characters."
            exit 1
          fi

      - name: Check out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Gather Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch }}
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=${{ inputs.tag || github.ref_name }},enable=${{ github.event_name == 'workflow_dispatch' }}
          labels: |
            org.opencontainers.image.title=Cowbird

      - name: Login to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker image and publish to Docker Hub
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile-base
          labels: ${{ steps.meta.outputs.labels }}
          load: true  # needed so the image is available locally for the "Inspect labels" step below
          push: true
          tags: ${{ steps.meta.outputs.tags }}

      - name: Inspect labels
        run: |
          docker inspect --format='{{json .Config.Labels}}' \
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}

  build-publish-variants:
    name: Build and publish (${{ matrix.image }})
    needs: build-publish-base
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: "pavics/cowbird"
    strategy:
      matrix:
        include:
          - image: Cowbird webservice
            dockerfile: Dockerfile-webservice
            suffix: "-webservice"
          - image: Cowbird worker
            dockerfile: Dockerfile-worker
            suffix: "-worker"
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          disable-sudo: true
          egress-policy: audit

      - name: Check out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Gather Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest${{ matrix.suffix }},enable=${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch }}
            type=ref,event=tag,suffix=${{ matrix.suffix }}
            type=raw,value=latest${{ matrix.suffix }},enable=${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=${{ inputs.tag || github.ref_name }}${{ matrix.suffix }},enable=${{ github.event_name == 'workflow_dispatch' }}
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}

      - name: Login to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker image and publish to Docker Hub
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/${{ matrix.dockerfile }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}

