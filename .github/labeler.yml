# label rules used by .github/workflows/label.yml

api:
  - changed-files:
      - any-glob-to-any-file: 'cowbird/api/**/*'

cli:
  - changed-files:
      - any-glob-to-any-file: 'cowbird/cli/**/*'

handler:
  - changed-files:
      - any-glob-to-any-file:
          - 'cowbird/handlers/**/*'
          - 'cowbird/monitoring/**/*'

permissions:
  - changed-files:
      - any-glob-to-any-file: 'cowbird/permissions_synchronizer.py'

# label 'ci' all automation-related steps and files
ci:
  - changed-files:
      - any-glob-to-any-file:
          - '.*'  # all '.<>' files
          - '.github/**/*'
          - 'ci/**/*'
          - 'hooks/**/*'
          - 'Makefile'
          - 'Dockerfile*'
          - 'setup.cfg'

doc:
  - changed-files:
      - any-glob-to-any-file:
          - '*.rst'
          - '*.example'
          - 'doc/**/*'
          - 'requirements-doc.txt'

tests:
  - changed-files:
      - any-glob-to-any-file:
          - 'tests/**/*'
          - 'requirements-dev.txt'
